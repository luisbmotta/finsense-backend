services:
  postgres:
    image: postgres:16-alpine
    container_name: finsense-postgres
    environment:
      POSTGRES_DB: finsense
      POSTGRES_USER: finsense
      POSTGRES_PASSWORD: finsense
    ports:
      - "5432:5432"
    volumes:
      - finsense-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finsense -d finsense"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  finsense-postgres-data:
