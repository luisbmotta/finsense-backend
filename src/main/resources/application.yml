spring:
  application:
    name: finsense-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finsense}
    username: ${DB_USERNAME:finsense}
    password: ${DB_PASSWORD:finsense}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}

finsense:
  jwt:
    # Dev-only default secret (HS256, >=256 bits). Override with a real secret via
    # the JWT_SECRET env var in any shared/deployed environment.
    secret: ${JWT_SECRET:dGhpcy1pcy1hLWRldi1vbmx5LWZpbnNlbnNlLWp3dC1zZWNyZXQtY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    com.finsense.backend: INFO
